# Application Configuration
spring.application.name=jobtrack-backend
server.port=8080

# Default profile: dev (H2 with PostgreSQL compatibility for zero-friction setup)
# Set SPRING_PROFILES_ACTIVE=postgres to use real PostgreSQL instance
spring.profiles.active=dev

# SpringDoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.com.jobtrack=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
